<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Allusiion</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      background:#070707;
      color:#fff;
      font-family:Arial, Helvetica, sans-serif;
      overflow-x:hidden;
    }

    /* FORCE TOUT EN BLANC + PAS DE SOULIGNEMENT */
    h1,h2,h3,h4,h5,p,span,div,a{
      color:#fff;
      text-decoration:none;
    }

    a{
      color:#fff;
      text-decoration:none;
    }

    section{
      width:100%;
      padding:100px 10%;
    }

    /* HERO */
    .hero{
      height:100vh;
      position:relative;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      overflow:hidden;
    }

    .hero video{
      position:absolute;
      width:100%;
      height:100%;
      object-fit:cover;
      opacity:0.18;
    }

    .overlay{
      position:absolute;
      inset:0;
      background:linear-gradient(to bottom, rgba(0,0,0,0.2), rgba(0,0,0,0.85));
    }

    .hero-content{
      position:relative;
      z-index:2;
    }

    .hero h1{
      font-size:clamp(3rem, 8vw, 7rem);
      letter-spacing:4px;
      text-transform:uppercase;
    }

    .hero p{
      margin-top:20px;
      opacity:0.8;
    }

    .buttons{
      margin-top:40px;
      display:flex;
      gap:20px;
      justify-content:center;
      flex-wrap:wrap;
    }

    .btn{
      padding:14px 26px;
      border:1px solid #ffffff33;
      background:#ffffff10;
      border-radius:999px;
      cursor:pointer;
      transition:0.3s;
      text-decoration:none;
    }

    .btn:hover{
      transform:translateY(-3px);
      background:#ffffff20;
    }

    /* TITLES */
    .section-title{
      font-size:2.5rem;
      margin-bottom:50px;
      text-transform:uppercase;
      letter-spacing:2px;
    }

    /* SHOWREEL */
    .showreel-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:20px;
    }

    .clip{
      border-radius:18px;
      overflow:hidden;
      cursor:pointer;
      transition:0.3s;
      background:#111;
    }

    .clip:hover{
      transform:scale(1.02);
    }

    .clip video{
      width:100%;
      display:block;
    }

    /* TIMELINE */
    .timeline{
      display:flex;
      flex-wrap:wrap;
      gap:20px;
      justify-content:center;
    }

    .step{
      flex:1;
      min-width:180px;
      background:#101010;
      padding:30px;
      border-radius:18px;
      text-align:center;
      border:1px solid #ffffff10;
    }

    .step span{
      display:block;
      font-size:0.9rem;
      opacity:0.6;
      margin-bottom:10px;
    }

    /* CONTACT */
    .contact{
      text-align:center;
    }

    .contact h2{
      font-size:3rem;
    }

    .contact-links{
      margin-top:40px;
      display:flex;
      justify-content:center;
      gap:20px;
      flex-wrap:wrap;
    }

    .contact-links a{
      padding:14px 24px;
      background:#111;
      border-radius:999px;
      border:1px solid #ffffff20;
      text-decoration:none;
    }

    .contact-links a:hover{
      transform:translateY(-4px);
      background:#1a1a1a;
    }

    footer{
      padding:40px;
      text-align:center;
      opacity:0.5;
      border-top:1px solid #ffffff10;
    }

    /* MODAL (vidéo en grand) */
    #modal{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.92);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:999;
    }

    #modal video{
      width:80%;
      max-height:80%;
      border-radius:12px;
    }

  </style>
</head>

<body>

<!-- HERO -->
<section class="hero">

  <video autoplay muted loop playsinline>
    <source src="background.mp4" type="video/mp4">
  </video>

  <div class="overlay"></div>

  <div class="hero-content">
    <h1>Allusiion</h1>

    <p>
      Animated Commissions Open <br>
      Loops • Short Scenes • Character Animation
    </p>

    <div class="buttons">
      <a class="btn" href="#showreel">Mes animations</a>
      <a class="btn" href="#contact">Contact</a>
    </div>
  </div>

</section>

<!-- SHEET COMMISSIONS -->
<section id="Sheet commissions">

  <h2 class="section-title">Sheet commissions</h2>

  <div class="showreel-grid">

    <div class="clip">
      <video muted loop playsinline onclick="openModal(this)">
        <source src="clip1.mp4">
      </video>
    </div>

    <div class="clip">
      <video muted loop playsinline onclick="openModal(this)">
        <source src="clip2.mp4">
      </video>
    </div>

    <div class="clip">
      <video muted loop playsinline onclick="openModal(this)">
        <source src="clip3.mp4">
      </video>
    </div>

  </div>

</section>

<!-- PROCESS -->
<section>

  <h2 class="section-title">Process</h2>

  <div class="timeline">

    <div class="step"><span>01</span>Sketch</div>
    <div class="step"><span>02</span>Animation</div>
    <div class="step"><span>03</span>Cleanup</div>
    <div class="step"><span>04</span>Rendering</div>
    <div class="step"><span>05</span>Delivery</div>

  </div>

</section>

<!-- CONTACT -->
<section id="contact" class="contact">

  <h2>LET'S CREATE</h2>

  <div class="contact-links">
    <a href="https://www.instagram.com/allumotion/">Instagram</a>
    <a href="mailto:allusiion3003@gmail.com">Email</a>
  </div>

</section>

<footer>
  Frame by frame. Loop by loop.
</footer>

<!-- MODAL VIDEO -->
<div id="modal" onclick="closeModal()">
  <video id="modalVideo" controls autoplay></video>
</div>

<script>
  const modal = document.getElementById("modal");
  const modalVideo = document.getElementById("modalVideo");

  function openModal(video){
    modal.style.display = "flex";
    modalVideo.src = video.querySelector("source").src;
  }

  function closeModal(){
    modal.style.display = "none";
    modalVideo.pause();
    modalVideo.src = "";
  }
</script>

</body>
</html>
